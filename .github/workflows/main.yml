name: Main

# Gatekeeper for `main`:
#   - `ci` runs the cargo lifecycle (clippy, build, test) on every push to
#     main and every PR targeting main. Pair this with a branch protection
#     rule on `main` requiring the "cargo checks" job to pass before merge —
#     this file only defines the check, it can't enforce that by itself.
#   - `revert-on-failure` only runs for direct pushes to main (not PRs). If
#     `ci` fails, it reverts the breaking commit and pushes the revert
#     straight to main so main stays green.
#
# IMPORTANT: `revert-on-failure` pushes directly to `main`. If branch
# protection blocks direct pushes for everyone (recommended — see the repo
# settings), this job's push will also be blocked unless the identity behind
# `secrets.REVERT_TOKEN` is specifically allowed to bypass that rule. Without
# such an exception, use this job's failure as a signal to revert by hand
# instead. `REVERT_TOKEN` must be a PAT (not the default GITHUB_TOKEN, which
# generally can't push to a protected branch) belonging to an account with
# that bypass permission; add it as a repository secret.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: cargo checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  revert-on-failure:
    name: Revert breaking push to main
    needs: ci
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.REVERT_TOKEN }}

      - name: Revert the breaking commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "${{ github.sha }}"
          git push origin HEAD:main
