name: Release

# Summary of the workflow:
# 1. Trigger: this workflow runs when a version tag like v0.1.0 is pushed,
#    or when you manually run it from the GitHub Actions UI.
# 2. Build: it compiles the app separately for Windows, Linux, and macOS.
# 3. Assemble: it collects the built binaries into packaged release assets.
# 4. Release: it checks that the tag matches the version in Cargo.toml and
#    publishes a GitHub Release with those assets.

# This workflow is a GitHub Actions pipeline.
# A pipeline is a set of automated jobs that run in order when certain events happen.
# In this file, the event is a Git tag push or manual trigger.

# Trigger section: tells GitHub when to run the workflow.
on:
  push:
    tags:
      - 'v*'   # Run only for tags that start with v, such as v0.1.0
  workflow_dispatch:  # Allow manual run from the GitHub Actions tab

# Permissions section: defines what the workflow is allowed to do.
# contents: write means the workflow can create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # Job = one unit of work in the workflow.
  # The build job runs on multiple operating systems in parallel.
  build:
    strategy:
      # fail-fast: false means if one platform build fails, the others still continue.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: pocketvault.exe
            artifact_name: windows
            cli_target_name: pocketvault-cli.exe
            cli_artifact_name: cli-windows
          - os: ubuntu-latest
            target_name: pocketvault
            artifact_name: linux
            cli_target_name: pocketvault-cli
            cli_artifact_name: cli-linux
          - os: macos-latest
            target_name: pocketvault
            artifact_name: macos
            cli_target_name: pocketvault-cli
            cli_artifact_name: cli-macos

    # runs-on selects the virtual machine image for this job.
    # The matrix makes this job run 3 times, once per OS.
    runs-on: ${{ matrix.os }}

    steps:
      # Step = one action or command inside a job.
      # uses = run a prebuilt GitHub Action from the marketplace or GitHub.
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs Rust so cargo can build the project.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Caches Cargo dependencies to make future builds faster.
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      # This step only runs on Ubuntu because Linux GUI libraries are needed.
      # run = execute shell commands in the job environment.
      # pocketvault-cli has no GUI dependencies, so this is only for the
      # desktop app's build below.
      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config

      # Build the desktop app in release mode.
      - name: Build desktop release binary
        run: cargo build --release -p pocketvault-desktop

      # Upload the compiled binary as an artifact so later jobs can use it.
      # Artifact = a temporary file bundle passed between jobs.
      - name: Upload built desktop binary
        uses: actions/upload-artifact@v7
        with:
          name: pocketvault-${{ matrix.artifact_name }}
          path: target/release/${{ matrix.target_name }}
          retention-days: 3

      # Build the CLI in release mode — same three platforms, published
      # alongside the desktop app in the same release.
      - name: Build CLI release binary
        run: cargo build --release -p pocketvault-cli

      - name: Upload built CLI binary
        uses: actions/upload-artifact@v7
        with:
          name: pocketvault-${{ matrix.cli_artifact_name }}
          path: target/release/${{ matrix.cli_target_name }}
          retention-days: 3

  # assemble job depends on build.
  # needs: build means this job waits until the build job completes.
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Download each platform artifact created by the build job.
      - name: Download windows artifact
        uses: actions/download-artifact@v7
        with:
          name: pocketvault-windows
          path: artifacts/windows

      - name: Download linux artifact
        uses: actions/download-artifact@v7
        with:
          name: pocketvault-linux
          path: artifacts/linux

      - name: Download mac artifact
        uses: actions/download-artifact@v7
        with:
          name: pocketvault-macos
          path: artifacts/macos

      # Same three platforms, but for the CLI binaries.
      - name: Download CLI windows artifact
        uses: actions/download-artifact@v7
        with:
          name: pocketvault-cli-windows
          path: artifacts/cli-windows

      - name: Download CLI linux artifact
        uses: actions/download-artifact@v7
        with:
          name: pocketvault-cli-linux
          path: artifacts/cli-linux

      - name: Download CLI mac artifact
        uses: actions/download-artifact@v7
        with:
          name: pocketvault-cli-macos
          path: artifacts/cli-macos

      # This shell script collects the downloaded binaries and packages them.
      # It uses basic Linux shell commands like mkdir, cp, zip, tar, and mv.
      - name: Create combined packages
        run: |
          set -e
          mkdir -p release-assets pkg

          # Copy each downloaded binary into a release-assets folder.
          if [ -d artifacts/windows ]; then
            f=$(ls -1 artifacts/windows | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/windows/$f" release-assets/pocketvault-windows-x86_64.exe || true
            fi
          fi

          if [ -d artifacts/linux ]; then
            f=$(ls -1 artifacts/linux | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/linux/$f" release-assets/pocketvault-linux-x86_64 || true
            fi
          fi

          if [ -d artifacts/macos ]; then
            f=$(ls -1 artifacts/macos | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/macos/$f" release-assets/pocketvault-macos-x86_64 || true
            fi
          fi

          # Same as above, for the CLI binaries.
          if [ -d artifacts/cli-windows ]; then
            f=$(ls -1 artifacts/cli-windows | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/cli-windows/$f" release-assets/pocketvault-cli-windows-x86_64.exe || true
            fi
          fi

          if [ -d artifacts/cli-linux ]; then
            f=$(ls -1 artifacts/cli-linux | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/cli-linux/$f" release-assets/pocketvault-cli-linux-x86_64 || true
            fi
          fi

          if [ -d artifacts/cli-macos ]; then
            f=$(ls -1 artifacts/cli-macos | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/cli-macos/$f" release-assets/pocketvault-cli-macos-x86_64 || true
            fi
          fi

          # Put the files into a temporary pkg folder with consistent names.
          cp release-assets/pocketvault-windows-x86_64.exe pkg/pocketvault.exe || true
          cp release-assets/pocketvault-linux-x86_64 pkg/pocketvault || true

          # CLI binaries get their own subfolder per platform (rather than
          # flat in pkg/) since the linux and macos ones would otherwise
          # collide on the same clean filename ("pocketvault-cli").
          mkdir -p pkg/cli-windows pkg/cli-linux pkg/cli-macos
          cp release-assets/pocketvault-cli-windows-x86_64.exe pkg/cli-windows/pocketvault-cli.exe || true
          cp release-assets/pocketvault-cli-linux-x86_64 pkg/cli-linux/pocketvault-cli || true
          cp release-assets/pocketvault-cli-macos-x86_64 pkg/cli-macos/pocketvault-cli || true

          # Create a lightweight macOS .app bundle with only the binary and a minimal plist.
          version=$(grep '^version' pocketvault-desktop/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          mkdir -p "pkg/PocketVault.app/Contents/MacOS" "pkg/PocketVault.app/Contents/Resources"
          cp release-assets/pocketvault-macos-x86_64 pkg/PocketVault.app/Contents/MacOS/pocketvault || true
          chmod +x "pkg/PocketVault.app/Contents/MacOS/pocketvault" || true
          cat > "pkg/PocketVault.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>pocketvault</string>
            <key>CFBundleIdentifier</key><string>com.pocketvault.app</string>
            <key>CFBundleName</key><string>PocketVault</string>
            <key>CFBundleDisplayName</key><string>PocketVault</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
          </dict>
          </plist>
          EOF

          # Make the Linux binaries executable so they can run directly after download.
          chmod +x pkg/pocketvault || true
          chmod +x release-assets/pocketvault-linux-x86_64 || true
          chmod +x pkg/cli-linux/pocketvault-cli || true
          chmod +x release-assets/pocketvault-cli-linux-x86_64 || true
          chmod +x pkg/cli-macos/pocketvault-cli || true

          # Create platform-specific archives.
          zip -j pocketvault-windows-x86_64.zip pkg/pocketvault.exe || true
          tar -C pkg -czf pocketvault-linux-x86_64.tar.gz pocketvault || true
          (cd pkg && zip -r ../release-assets/pocketvault-macos-x86_64.app.zip PocketVault.app) || true

          # Same three platforms, for the CLI — no .app bundle needed, it's
          # a terminal tool, so just a plain archive per platform.
          zip -j pocketvault-cli-windows-x86_64.zip pkg/cli-windows/pocketvault-cli.exe || true
          tar -C pkg/cli-linux -czf pocketvault-cli-linux-x86_64.tar.gz pocketvault-cli || true
          zip -j pocketvault-cli-macos-x86_64.zip pkg/cli-macos/pocketvault-cli || true

          mv pocketvault-*.zip pocketvault-*.tar.gz release-assets/ || true
          ls -la release-assets

      # Save the assembled release files as a new artifact for the next job.
      - name: Upload combined packages
        uses: actions/upload-artifact@v7
        with:
          name: combined-packages
          path: release-assets/
          retention-days: 3

  # release job depends on assemble.
  # This job only runs for real tag pushes, not for manual branch runs.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # This step reads the version from Cargo.toml and confirms the Git tag matches it.
      # GITHUB_REF is the current tag ref, such as refs/tags/v0.1.0.
      # GITHUB_OUTPUT lets a step pass data to later steps.
      # pocketvault-cli's version is checked too, since it's meant to track
      # the desktop version in lockstep — this catches forgetting to bump one
      # of the two before tagging.
      - name: Read version from Cargo.toml and validate tag
        id: version
        run: |
          version=$(grep '^version' pocketvault-desktop/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          cli_version=$(grep '^version' pocketvault-cli/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          tag=${GITHUB_REF#refs/tags/}
          if [ "v$version" != "$tag" ]; then
            echo "Tag name ($tag) does not match pocketvault-desktop/Cargo.toml version (v$version)"
            exit 1
          fi
          if [ "$cli_version" != "$version" ]; then
            echo "pocketvault-cli/Cargo.toml version ($cli_version) does not match pocketvault-desktop/Cargo.toml version ($version) — bump both together"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Download the packaged assets from the previous job.
      - name: Download combined packages
        uses: actions/download-artifact@v7
        with:
          name: combined-packages
          path: release-assets

      # Create the actual GitHub Release page and attach the files.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PocketVault ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
