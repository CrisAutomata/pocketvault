name: Release

# Builds and publishes a GitHub Release whenever a version tag is pushed.
# Use tags like v0.1.0, v0.1.1, etc. to create releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: pocketvault.exe
          - os: ubuntu-latest
            target_name: pocketvault
          - os: macos-latest
            target_name: pocketvault

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --release -p pocketvault-desktop

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: target/release/${{ matrix.target_name }}
          retention-days: 7


  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create combined packages
        run: |
          set -e
          mkdir -p release-assets pkg

          # For each downloaded artifact subdir, pick its first file and map by platform
          for d in artifacts/*; do
            name=$(basename "$d")
            if [ -d "$d" ]; then
              f=$(ls -1 "$d" | head -n1 || true)
              if [ -n "$f" ]; then
                src="$d/$f"
                if [[ "$name" == *windows* ]]; then
                  cp "$src" release-assets/pocketvault-windows-x86_64.exe || true
                elif [[ "$name" == *ubuntu* || "$name" == *linux* ]]; then
                  cp "$src" release-assets/pocketvault-linux-x86_64 || true
                elif [[ "$name" == *macos* ]]; then
                  cp "$src" release-assets/pocketvault-macos-x86_64 || true
                else
                  # fallback: copy with artifact name prefix
                  cp "$src" "release-assets/${name}_$(basename $f)" || true
                fi
              fi
            fi
          done

          # Prepare pkg with consistent internal filenames
          cp release-assets/pocketvault-windows-x86_64.exe pkg/pocketvault.exe || true
          cp release-assets/pocketvault-linux-x86_64 pkg/pocketvault || true
          cp release-assets/pocketvault-macos-x86_64 pkg/pocketvault-macos || true

          # Create platform archives that each contain all three executables
          zip -j pocketvault-windows-x86_64.zip pkg/pocketvault.exe pkg/pocketvault pkg/pocketvault-macos || true
          tar -C pkg -czf pocketvault-linux-x86_64.tar.gz pocketvault pocketvault.exe pocketvault-macos || true
          tar -C pkg -czf pocketvault-macos-x86_64.tar.gz pocketvault pocketvault.exe pocketvault-macos || true

          mv pocketvault-*.zip pocketvault-*.tar.gz release-assets/ || true
          ls -la release-assets

      - name: Upload combined packages
        uses: actions/upload-artifact@v4
        with:
          name: combined-packages
          path: release-assets/
          retention-days: 7


  release:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml and validate tag
        id: version
        run: |
          version=$(grep '^version' pocketvault-desktop/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          tag=${GITHUB_REF#refs/tags/}
          if [ "v$version" != "$tag" ]; then
            echo "Tag name ($tag) does not match Cargo.toml version (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download combined packages
        uses: actions/download-artifact@v4
        with:
          name: combined-packages
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PocketVault ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
