name: Release

# Builds and publishes a GitHub Release whenever a version tag is pushed.
# Use tags like v0.1.0, v0.1.1, etc. to create releases.
# git tag v0.1.1
# git push origin v0.1.1
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: pocketvault.exe
            artifact_name: windows
          - os: ubuntu-latest
            target_name: pocketvault
            artifact_name: linux
          - os: macos-latest
            target_name: pocketvault
            artifact_name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --release -p pocketvault-desktop

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: pocketvault-${{ matrix.artifact_name }}
          path: target/release/${{ matrix.target_name }}
          retention-days: 3


  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pocketvault-windows
          path: artifacts/windows

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pocketvault-linux
          path: artifacts/linux

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: pocketvault-macos
          path: artifacts/macos

      - name: Create combined packages
        run: |
          set -e
          mkdir -p release-assets pkg

          # Map downloaded artifact folders to release-assets (deterministic)
          if [ -d artifacts/windows ]; then
            f=$(ls -1 artifacts/windows | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/windows/$f" release-assets/pocketvault-windows-x86_64.exe || true
            fi
          fi

          if [ -d artifacts/linux ]; then
            f=$(ls -1 artifacts/linux | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/linux/$f" release-assets/pocketvault-linux-x86_64 || true
            fi
          fi

          if [ -d artifacts/macos ]; then
            f=$(ls -1 artifacts/macos | head -n1 || true)
            if [ -n "$f" ]; then
              cp "artifacts/macos/$f" release-assets/pocketvault-macos-x86_64 || true
            fi
          fi

          # Prepare pkg with consistent internal filenames
          cp release-assets/pocketvault-windows-x86_64.exe pkg/pocketvault.exe || true
          cp release-assets/pocketvault-linux-x86_64 pkg/pocketvault || true
          cp release-assets/pocketvault-macos-x86_64 pkg/pocketvault-macos || true

          # Create platform archives that each contain all three executables
          zip -j pocketvault-windows-x86_64.zip pkg/pocketvault.exe pkg/pocketvault pkg/pocketvault-macos || true
          tar -C pkg -czf pocketvault-linux-x86_64.tar.gz pocketvault pocketvault.exe pocketvault-macos || true
          tar -C pkg -czf pocketvault-macos-x86_64.tar.gz pocketvault pocketvault.exe pocketvault-macos || true

          mv pocketvault-*.zip pocketvault-*.tar.gz release-assets/ || true
          ls -la release-assets

      - name: Upload combined packages
        uses: actions/upload-artifact@v4
        with:
          name: combined-packages
          path: release-assets/
          retention-days: 3


  release:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml and validate tag
        id: version
        run: |
          version=$(grep '^version' pocketvault-desktop/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          tag=${GITHUB_REF#refs/tags/}
          if [ "v$version" != "$tag" ]; then
            echo "Tag name ($tag) does not match Cargo.toml version (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download combined packages
        uses: actions/download-artifact@v4
        with:
          name: combined-packages
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PocketVault ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
