name: Release

# Builds and publishes a GitHub Release whenever the `release` branch is
# updated. Feature/development work should happen on other branches; only
# pushes that land on `release` (e.g. via a merged PR) trigger a build.
on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: pocketvault.exe
            asset_name: pocketvault-windows-x86_64.zip
          - os: ubuntu-latest
            target_name: pocketvault
            asset_name: pocketvault-linux-x86_64.tar.gz
          - os: macos-latest
            target_name: pocketvault
            asset_name: pocketvault-macos-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --release -p pocketvault-desktop

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/release/${{ matrix.target_name }}" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf "${{ matrix.asset_name }}" -C target/release "${{ matrix.target_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(grep '^version' pocketvault-desktop/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PocketVault v${{ steps.version.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
